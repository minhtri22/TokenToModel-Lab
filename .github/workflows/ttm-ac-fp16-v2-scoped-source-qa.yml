name: TTM AC FP16 V2 scoped source QA
on:
  push:
    branches:
      - research/ttm-small4m-prompt-conditioning-objective-design-20261110
    paths:
      - .github/workflows/ttm-ac-fp16-v2-scoped-source-qa.yml
      - tools/pilot_t4/prompt_conditioning_2x2/independent_ac_fp16_v2_ast_fake_backend_qa.py
      - tools/pilot_t4/prompt_conditioning_2x2/ttm_ac_objective_runner_fp16_backoff_v2_REVIEW_CANDIDATE.py
      - tools/pilot_t4/prompt_conditioning_2x2/ttm_ac_fp16_v2_actual_train_resume_parity_preexec.py
      - tools/pilot_t4/prompt_conditioning_2x2/TTM_AC_2ARM_ONE_PACKET_T4_OWNER_COLAB_20261111.ipynb
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ttm-ac-fp16-v2-scoped-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scoped-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependency
        run: python -m pip install --disable-pip-version-check numpy==2.4.4
      - name: Verify exact candidate AST and 7 fake GradScaler negative cases
        shell: bash
        run: |
          set -euo pipefail
          python tools/pilot_t4/prompt_conditioning_2x2/independent_ac_fp16_v2_ast_fake_backend_qa.py \
            --candidate tools/pilot_t4/prompt_conditioning_2x2/ttm_ac_objective_runner_fp16_backoff_v2_REVIEW_CANDIDATE.py \
            --out "$RUNNER_TEMP/AC_FP16_V2_AST_FAKE_BACKEND_SCOPED_QA.json"
          python - "$RUNNER_TEMP/AC_FP16_V2_AST_FAKE_BACKEND_SCOPED_QA.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['status']=='PASS_SCOPED_SOURCE_AST_FAKE_BACKEND_7_OF_7'
          assert len(d['cases'])==7 and all(c['pass'] for c in d['cases'])
          assert d['ac_science_training'] is False
          assert d['real_gpu_access'] is False
          print('CI_SCOPE=SOURCE_AST_AND_FAKE_SCALER_ONLY')
          PY
      - name: Compile V2 Colab integration and check no unsanctioned science
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             tools/pilot_t4/prompt_conditioning_2x2/ttm_ac_fp16_v2_actual_train_resume_parity_preexec.py             tools/pilot_t4/prompt_conditioning_2x2/ttm_ac_objective_runner_fp16_backoff_v2_REVIEW_CANDIDATE.py
          python - <<'PY'
          import json,ast,pathlib
          path=pathlib.Path('tools/pilot_t4/prompt_conditioning_2x2/TTM_AC_2ARM_ONE_PACKET_T4_OWNER_COLAB_20261111.ipynb')
          n=json.loads(path.read_text('utf-8'))
          assert n['nbformat']==4
          codes=[c['source'] for c in n['cells'] if c['cell_type']=='code']
          assert len(codes)==7
          scripts=[''.join(x) for x in codes]
          for i,c in enumerate(scripts):
              compile(c,f'colab-code-cell-{i+1}','exec')
          assert 'ac_science_v2.lock_science(args)' in ''.join(scripts)
          assert 'ac_science_v2.science(args,lock)' in ''.join(scripts)
          assert 'PASS_REAL_P02_T4_REAL_TRAIN_TWO_STEP_RESUME_PARITY_SCOPED' in ''.join(scripts)
          assert 'ACTUAL_AC_RESUME_INDEPENDENT_ADJUDICATION.json' in ''.join(scripts)
          assert 'NO_GO_PREEXEC_MISSING_OWNER_ATTESTATION_REVIEWER_OR_LOCK' in ''.join(scripts)
          assert 'ac.science(args,lock)' not in ''.join(scripts)
          assert 'AESGCM(key).decrypt' in ''.join(scripts)
          assert 'OWNER_KEY=OWNER/' in ''.join(scripts)
          assert 'OWNER_CONSENT_GITBLOB' in ''.join(scripts)
          assert 'PASS_OWNER_ATTESTED' in ''.join(scripts)
          assert 'PASS_INDEPENDENT_REVIEWER_LOCKED' in ''.join(scripts)
          assert 'PASS_ACTUAL_AC_RESUME_PARITY' in ''.join(scripts)
          assert 'ORIGINAL_AES_KEY_NOT_ON_OWNER_DRIVE' in ''.join(scripts)
          assert 'owner_gate_ready' in ''.join(scripts)
          assert 'KEY_CUSTODY' in ''.join(scripts)
          assert 'OWNER_AC_SCIENCE_LOCK.json' in ''.join(scripts)
          print('TTM_AC_COLAB_V8_AST_OWNER_ESCROW_AND_SCIENCE_GATES=PASS_SCOPED')
          PY
      - name: Upload source-only QA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttm-ac-fp16-v2-source-fake-qa
          path: ${{ runner.temp }}/AC_FP16_V2_AST_FAKE_BACKEND_SCOPED_QA.json
          if-no-files-found: warn
          retention-days: 30
