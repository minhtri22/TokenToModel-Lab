name: TTM matched4M CPU synthetic checkpoint resume native QA
on:
  push:
    branches:
      - implementation/ttm-pm-new-gpt-baseline-colab-t4-onepack-20261117
    paths:
      - "src/ttm_new_gpt_baseline/runner.py"
      - "notebooks/TTM_NEW_GPT_BASELINE_T4_ONEPACK_20261117.ipynb"
      - ".github/workflows/ttm-matched4m-native-resume-qa-py312.yml"
  pull_request:
    paths:
      - "src/ttm_new_gpt_baseline/runner.py"
      - "notebooks/TTM_NEW_GPT_BASELINE_T4_ONEPACK_20261117.ipynb"
      - ".github/workflows/ttm-matched4m-native-resume-qa-py312.yml"
permissions:
  contents: read
jobs:
  cpu-toy-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch for synthetic-only checkpoint QA
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir numpy==1.26.4
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Real serialization + synthetic CPU resume parity and corruption negative QA
        run: python src/ttm_new_gpt_baseline/runner.py native-qa --sources . --out ttm_matched4m_cpu_toy_resume_qa_receipt.json
      - name: Save scoped receipt (no private data, no weights)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ttm-matched4m-cpu-toy-resume-qa
          path: ttm_matched4m_cpu_toy_resume_qa_receipt.json
          if-no-files-found: error
