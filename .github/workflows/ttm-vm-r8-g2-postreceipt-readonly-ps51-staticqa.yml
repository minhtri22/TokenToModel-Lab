name: TTM VM R8 G2 postreceipt read-only PS5.1 source QA

on:
  push:
    branches:
      - implementation/ttm-vm-r8-g2-owner-windows-preexec-20261115
    paths:
      - docs/research/vector-memory/r8/preexec/Inspect-TTM-VM-R8-G2-Existing-Receipt-And-Pins-ReadOnly-PS51.ps1
      - .github/workflows/ttm-vm-r8-g2-postreceipt-readonly-ps51-staticqa.yml

permissions:
  contents: read

jobs:
  read-only-source-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact script parser and non-mutating command AST policy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Script='docs/research/vector-memory/r8/preexec/Inspect-TTM-VM-R8-G2-Existing-Receipt-And-Pins-ReadOnly-PS51.ps1'
          $tokens=$null; $errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $Script).Path,[ref]$tokens,[ref]$errors)
          if(-not $ast -or $errors.Count -ne 0) {
            foreach($errorItem in $errors){Write-Host ('PARSER_ERROR: '+$errorItem.Message)}
            throw 'POSTRECEIPT_PS51_PARSE_FAILED'
          }
          $forbidden=@('Set-Content','Add-Content','Out-File','Write-OutputToFile','New-Item','Remove-Item','Copy-Item','Move-Item','Rename-Item','Set-Item','Invoke-WebRequest','Start-Process','git','gh','curl','Invoke-RestMethod','Invoke-Expression')
          $commands=$ast.FindAll({param($a) $a -is [System.Management.Automation.Language.CommandAst]},$true)
          foreach($node in $commands){
            $name=$node.GetCommandName()
            if($name -and $forbidden -contains $name) {throw ('FORBIDDEN_READONLY_COMMAND: '+$name)}
          }
          $raw=[IO.File]::ReadAllText((Resolve-Path $Script).Path)
          foreach($required in @('EXISTING_G2_RECEIPT_SHA256=PASS','RUNTIME_EXACT_PIN=NOT_ATTESTED_WITHOUT_ORIGINAL_MANIFEST','G3=NOT_EXECUTED','G2=HOLD_INTEGRATED')) {
            if(-not $raw.Contains($required)){throw ('REQUIRED_STATUS_MISSING: '+$required)}
          }
          Write-Host 'POSTRECEIPT_PS51_PARSE=PASS'
          Write-Host 'POSTRECEIPT_READONLY_AST_SCOPE=PASS'
          Write-Host 'OWNER_PRIVATE_RECEIPT_READBACK=NOT_EXECUTED_ON_HOSTED_RUNNER'
