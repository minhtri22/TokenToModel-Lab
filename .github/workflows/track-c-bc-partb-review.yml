name: Agent C PR36 F01-F04 exact B-source cross-track QA
on:
  push:
    branches:
      - "review/ttm-c-bc-f01-f04-20261117"
    paths:
      - "tests/ttm_track_bc/test_c_part_b_independent_f01_f04.py"
      - "tests/ttm_track_bc/c_part_b_c_v2_reference.py"
      - ".github/workflows/track-c-bc-partb-review.yml"
permissions:
  contents: read
jobs:
  c-pr36-review:
    name: C Part B native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official CPU-only PyTorch for source-scoped P02 probe
        shell: bash
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Exact B-source C-authored 19 independent negative checks
        shell: bash
        run: |
          python -c "import sys,torch; assert sys.version_info[:2] == (3,12); print(sys.version,torch.__version__)"
          python -B -m unittest discover -s tests/ttm_track_bc -p 'test_c_part_b_independent_f01_f04.py' -v
