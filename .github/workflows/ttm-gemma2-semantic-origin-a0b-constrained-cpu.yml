name: TTM GEMMA2 A0B constrained geometry source-only QA
on:
  push:
    branches:
      - research/ttm-gemma2-token-alignment-pretraining-causality-20261111
    paths:
      - .github/workflows/ttm-gemma2-semantic-origin-a0b-constrained-cpu.yml
      - tools/embeddinggemma2_swap/semantics_origin_a0/ttm_a0b_constrained_moment_residual_cpu.py
  workflow_dispatch:
jobs:
  synthetic-math-no-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '3'
      OMP_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU math dependencies
        run: python -m pip install --no-cache-dir numpy==2.3.5 scipy==1.17.0
      - name: Static source compile
        run: python -m py_compile tools/embeddinggemma2_swap/semantics_origin_a0/ttm_a0b_constrained_moment_residual_cpu.py
      - name: Synthetic moment-preservation and rejection tests
        run: python tools/embeddinggemma2_swap/semantics_origin_a0/ttm_a0b_constrained_moment_residual_cpu.py --mode fixture
