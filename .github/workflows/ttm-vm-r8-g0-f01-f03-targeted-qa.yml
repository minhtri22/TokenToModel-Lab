name: TTM VM R8 targeted G0-F01-F03 non-R8 QA
on:
  push:
    branches:
      - evidence/ttm-vm-v4-r8-g0-f01-f03-single-closure-20261114
    paths:
      - docs/research/vector-memory/r8/integrated_closure/**
      - .github/workflows/ttm-vm-r8-g0-f01-f03-targeted-qa.yml
permissions:
  contents: read
jobs:
  changed-contract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Only three new G0 findings: targeted symbolic negative QA
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m compileall -q docs/research/vector-memory/r8/integrated_closure
          python -m unittest discover -v -s docs/research/vector-memory/r8/integrated_closure -p test_g0_final_three_findings.py
          sha256sum \
            docs/research/vector-memory/r8/integrated_closure/gold_contract.py \
            docs/research/vector-memory/r8/integrated_closure/folds_raters.py \
            docs/research/vector-memory/r8/integrated_closure/test_g0_final_three_findings.py
          printf '%s\n' 'QA_SCOPE=G0_MINIMAL_PROOF_F07_EVENT_R8_MANIFEST_ONLY' \
            'HISTORIC_37_AND_25_NOT_RERUN=TRUE' 'R8_GENERATED=FALSE' \
            'PRIVATE_GOLD=NOT_ACCESSED' 'GPU=NO' 'READER=0' 'PROBE256=SEALED'
