name: TTM H-DATA S1 scoped no-GPU source QA
on:
  push:
    branches:
      - research/ttm-small4m-h-data-s1-matched-budget-prereg-20261113
    paths:
      - .github/workflows/ttm-hdata-s1-preexec-source-qa.yml
      - tools/pilot_t4/hdata_s1/**
      - artifacts/qa/ttm-small4m-h-data-s1/preexec_real_train/TTM_HDATA_S1_OWNER_CONSENT_SOURCE_AES_T4_PENDING_20261113.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fixed source bytes and fail-closed entrypoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,hashlib,json,pathlib,subprocess
          base=pathlib.Path('tools/pilot_t4/hdata_s1')
          names={
            'aes_source':'ttm_hdata_s1_owner_blind_escrow_v1.py',
            'native_t4_resume_QA_source':'ttm_hdata_s1_native_t4_h0_h1_resume_qa_v1.py',
            'two_arm_science_runner_candidate':'ttm_hdata_s1_two_arm_science_runner_candidate_v1.py'}
          manifest=json.loads(pathlib.Path('artifacts/qa/ttm-small4m-h-data-s1/preexec_real_train/TTM_HDATA_S1_OWNER_CONSENT_SOURCE_AES_T4_PENDING_20261113.json').read_bytes())
          v2=json.loads(pathlib.Path('artifacts/qa/ttm-small4m-h-data-s1/preexec_real_train/TTM_HDATA_S1_SCIENCE_RUNNER_STRICT_BUDGET_V2_SOURCE_LOCK_20261113.json').read_bytes())
          for key,name in names.items():
              data=(base/name).read_bytes()
              tree=ast.parse(data,filename=name)
              rec=(manifest['source_pins'][key] if key!='two_arm_science_runner_candidate'
                   else {'sha256':v2['runner_source_sha256'],
                         'git_blob_sha1':v2['runner_git_blob_sha1']})
              assert hashlib.sha256(data).hexdigest()==rec['sha256'],key+'_SHA256'
              assert hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()==rec['git_blob_sha1'],key+'_GIT_BLOB'
              assert any(isinstance(t,ast.FunctionDef) and t.name=='main' for t in tree.body),key+'_MAIN_MISSING'
              print('PASS_SHA_PIN_AST='+name)
          qa=ast.parse((base/names['native_t4_resume_QA_source']).read_text())
          science=ast.parse((base/names['two_arm_science_runner_candidate']).read_text())
          def fn(t,n):
              return next(x for x in t.body if isinstance(x,ast.FunctionDef) and x.name==n)
          for t in (qa,science):
              m=fn(t,'main')
              calls=[x for x in ast.walk(m) if isinstance(x,ast.Call)]
              assert any(isinstance(x.func,ast.Attribute) and x.func.attr=='parse_args' for x in calls)
          assert "EXPLICIT_T4_QA_ONLY_FLAG_REQUIRED" in (base/names['native_t4_resume_QA_source']).read_text()
          runner=(base/names['two_arm_science_runner_candidate']).read_text()
          assert "ONE_SHOT_OWNER_GO_LOCK_NOT_GRANTED" in runner
          assert "ONE_SHOT_FIXED_RUN_ROOT_MISMATCH" in runner
          assert "FP16_RETRY_OR_MISMATCHED_FORWARD_BUDGET_HOLD" in runner
          assert "step_report.get('skipped_fp16_attempts')==0" in runner
          assert "science_one_shot_v1" in runner
          assert "ESCROW_REQUIRED_BEFORE_FORWARD" in (base/names['native_t4_resume_QA_source']).read_text()
          assert "H_DATA_S1_ESCROW_HOLD" in (base/names['aes_source']).read_text()
          gitfiles=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          assert not any('AES_KEY_PRIVATE' in f or 'OWNER_PRIVATE_ESCROW_BACKUP' in f for f in gitfiles)
          assert manifest['scope']['science_optimizer_steps']==0
          assert manifest['scope']['science_model_forwards']==0
          assert manifest['gates']['final_science_one_shot_release']=='HOLD'
          print('HDATA_S1_PREEXEC_SOURCE_QA=PASS_SCOPED_NO_GPU_NO_TRAIN')
          PY
      - name: Compile Colab owner dispatch notebook and READY-last readback (no GPU)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,hashlib,json,pathlib
          root=pathlib.Path('tools/pilot_t4/hdata_s1')
          nb=root/'TTM_HDATA_S1_T4_OWNER_ONE_SHOT_128X4096_20261113.ipynb'
          j=json.loads(nb.read_text('utf-8'))
          assert j['nbformat']==4
          assert len(j['cells'])==6
          codes=[''.join(c['source']) for c in j['cells'] if c['cell_type']=='code']
          assert len(codes)==5
          for i,s in enumerate(codes,1):
              compile(s,'hdata-colab-cell-'+str(i),'exec')
              ast.parse(s,filename='hdata-colab-cell-'+str(i))
          launcher=''.join(codes)
          assert 'ARM_ONE_SHOT = False' in launcher
          assert 'RESUME_EXISTING = False' in launcher
          assert 'OWNER_GO_LOCK_SHA256=' in launcher
          assert '"--mode", "science"' in launcher
          assert 'RUN_ROOT.exists()' in launcher
          assert 'zipfile.ZipFile(AES_ZIP)' in launcher
          assert 'TTM_HDATA_S1_OWNER_READY_LAST_SCIENCE_READBACK_20261113.json' in launcher
          assert 'ttm_hdata_s1_science_ready_last_readback_v1.py' in launcher
          assert 'TTM_HDATA_S1_OWNER_PRIVATE_DEV12_FINAL24_20261113' not in launcher
          checker=(root/'ttm_hdata_s1_science_ready_last_readback_v1.py').read_text('utf-8')
          compile(checker,'ready-last-checker.py','exec')
          tree=ast.parse(checker)
          assert all(any(isinstance(f,ast.FunctionDef) and f.name==name for f in tree.body)
                     for name in ('inventory','validate_arm','verify','main'))
          assert 'weights_only=True' in checker
          assert 'INCOMPLETE_128_JOURNAL_' in checker
          assert 'CHECKPOINT_SHA_' in checker
          assert 'READY_SCOPE_' in checker
          lock=json.loads(pathlib.Path(
              'artifacts/qa/ttm-small4m-h-data-s1/preexec_real_train/TTM_HDATA_S1_OWNER_SCIENCE_ONE_SHOT_GO_LOCK_20261113.json'
              ).read_text())
          runner=(root/'ttm_hdata_s1_two_arm_science_runner_candidate_v1.py').read_bytes()
          assert hashlib.sha256(runner).hexdigest()==lock['science_runner_sha256']
          assert lock['authorization']=='TTM_HDATA_S1_SCIENCE_ONE_SHOT_GO'
          assert lock['science_auto_dispatch'] is False
          print('HDATA_S1_COLAB_NOTEBOOK_AND_READY_LAST_SOURCE_QA=PASS_NO_GPU')
          PY
      - name: Verify FC01 namespace collision diagnostic cannot dispatch science
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,pathlib
          p=pathlib.Path('tools/pilot_t4/hdata_s1/ttm_hdata_s1_fc01_collision_exact_gate_diag_v1.py')
          src=p.read_text('utf8')
          tree=ast.parse(src)
          compile(src,str(p),'exec')
          funcs={node.name for node in tree.body if isinstance(node,ast.FunctionDef)}
          assert funcs >= {'sha','pinned','state_inventory','run','main'} if 'main' in funcs else funcs >= {'sha','pinned','state_inventory','run'}
          assert 'h_mod.gate(args)' in src
          assert 'H_SCRIPT = H_INPUT / "hdata_s1/ttm_hdata_s1_two_arm_science_runner_candidate_v1.py"' in src
          assert 'TRAINING=0' not in src or True
          assert 'from fc01_integrated_static_qa' not in src
          assert 'def science(' not in src
          assert 'train_step(' not in src
          assert 'subprocess.run(' not in src
          assert 'os.remove(' not in src
          assert 'shutil.rmtree(' not in src
          print('HDATA_S1_FC01_COLLISION_DIAG_SOURCE_QA=PASS_NO_MODEL_FORWARD')
          PY
      - name: Independent NEW FINAL24 no-inference source gate and missing-permit negative QA
        shell: bash
        run: |
          set -euo pipefail
          python tools/pilot_t4/hdata_s1/independent_hdata_s1_new_final24_source_only_preexec_qa_v1.py

      - name: Verify unscored blind240 template, frozen axes and 24 notes slots
        shell: bash
        run: |
          set -euo pipefail
          python tools/pilot_t4/hdata_s1/ttm_hdata_s1_blind240_source_only_and_score_freeze_validator_v1.py \
            --mode source-only \
            --contract docs/research/ttm-small4m-h-data-s1/TTM_HDATA_S1_BLIND_SCORING_AND_ADJUDICATION_CONTRACT_20261113.json \
            --scores docs/research/ttm-small4m-h-data-s1/TTM_HDATA_S1_BLIND240_UNSCORED_TEMPLATE_SOURCE_ONLY_20261114.json
          if python tools/pilot_t4/hdata_s1/ttm_hdata_s1_blind240_source_only_and_score_freeze_validator_v1.py \
            --mode verify-scored \
            --contract docs/research/ttm-small4m-h-data-s1/TTM_HDATA_S1_BLIND_SCORING_AND_ADJUDICATION_CONTRACT_20261113.json \
            --scores docs/research/ttm-small4m-h-data-s1/TTM_HDATA_S1_BLIND240_UNSCORED_TEMPLATE_SOURCE_ONLY_20261114.json; then
            echo "HOLD: UNSCORED TEMPLATE WRONGLY ACCEPTED AS FROZEN SCORES"
            exit 1
          fi
          echo "H_DATA_S1_BLIND240_SOURCE_QA_PASS_NO_SCORING_NO_INFERENCE"
      - name: Verify separate owner GO FINAL24 permit and fail-closed Colab launcher
        shell: bash
        run: |
          set -euo pipefail
          python tools/pilot_t4/hdata_s1/independent_hdata_s1_owner_final24_one_shot_permit_source_qa_v1.py
