name: TTM GEMMA2 semantic-origin A0 synthetic CPU QA
on:
  push:
    branches:
      - research/ttm-gemma2-token-alignment-pretraining-causality-20261111
    paths:
      - .github/workflows/ttm-gemma2-semantic-origin-a0-cpu.yml
      - tools/embeddinggemma2_swap/semantics_origin_a0/**
  workflow_dispatch:
jobs:
  synthetic-no-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin CPU numpy
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.2.6
      - name: Compile source
        run: python -m py_compile tools/embeddinggemma2_swap/semantics_origin_a0/ttm_semantics_origin_a0_cpu_geometry.py
      - name: Mathematical synthetic negative and positive QA only
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 python tools/embeddinggemma2_swap/semantics_origin_a0/ttm_semantics_origin_a0_cpu_geometry.py --mode fixture
