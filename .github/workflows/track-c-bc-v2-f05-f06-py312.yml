name: Agent C BC v2 F05 F06 exact candidate 15 plus 19 negative QA
on:
  push:
    branches:
      - "review/ttm-c-bc-v2-f05-f06-20261117"
    paths:
      - ".github/workflows/track-c-bc-v2-f05-f06-py312.yml"
      - "tests/ttm_track_bc/test_c_f05_f06_new_exact.py"
      - "tests/ttm_track_bc/test_c_part_b_independent_f01_f04.py"
      - "tests/ttm_track_bc/c_part_b_c_v2_reference.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c-bc-f05-f06:
    name: C F05 F06 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyTorch CPU-only (no accelerator, no science)
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate Python 3.12 CPU setup
        run: python -c "import sys,torch; assert sys.version_info[:2]==(3,12); assert not torch.cuda.is_available(); print(sys.version,torch.__version__)"
      - name: C fresh 15 F05 F06 and custody negatives (NO SKIPS)
        run: python -B -m unittest discover -s tests/ttm_track_bc -p test_c_f05_f06_new_exact.py -v
      - name: C prior 19 F01 F04 exact B v2 regression (NO SKIPS)
        run: python -B -m unittest discover -s tests/ttm_track_bc -p test_c_part_b_independent_f01_f04.py -v
