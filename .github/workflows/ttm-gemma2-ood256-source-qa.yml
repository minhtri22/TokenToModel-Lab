name: TTM GEMMA2 OOD256 source-only QA
on:
  push:
    branches:
      - research/ttm-small4m-embeddinggemma2-ood-design-20261111
    paths:
      - .github/workflows/ttm-gemma2-ood256-source-qa.yml
      - tools/embeddinggemma2_swap/ood_wikitext2_v1/**
  workflow_dispatch:
jobs:
  static-and-synthetic-only:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only CPU fixture dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu \
            numpy==2.2.6 torch==2.6.0
      - name: Compile frozen sources
        run: |
          python -m py_compile \
            tools/embeddinggemma2_swap/ood_wikitext2_v1/ttm_ood256_inference_only_12arm.py \
            tools/embeddinggemma2_swap/ood_wikitext2_v1/ttm_ood256_independent_science_readback.py \
            tools/embeddinggemma2_swap/ood_wikitext2_v1/ttm_ood256_scorer_interface_cpu_fixture.py \
            tools/embeddinggemma2_swap/ood_wikitext2_v1/ttm_ood_wikitext2_cpu_seal.py
      - name: Main source synthetic fixture (no model forward)
        run: |
          python tools/embeddinggemma2_swap/ood_wikitext2_v1/ttm_ood256_inference_only_12arm.py --mode fixture
      - name: Independent math fixture (no model forward)
        run: |
          python tools/embeddinggemma2_swap/ood_wikitext2_v1/ttm_ood256_independent_science_readback.py --mode fixture
      - name: Precomputed logits synthetic fixture (no model forward)
        run: |
          python tools/embeddinggemma2_swap/ood_wikitext2_v1/ttm_ood256_scorer_interface_cpu_fixture.py --mode fixture
