name: TTM GEMMA2 A0E integrated v3 source and negative QA
on:
  push:
    branches: [research/ttm-gemma2-token-alignment-pretraining-causality-20261111]
    paths:
      - tools/embeddinggemma2_swap/semantics_origin_a0/ttm_a0e_prospective_real_tensor_verifier_v1.py
      - tools/embeddinggemma2_swap/semantics_origin_a0/ttm_a0e_lexical_locked_scorer_v1.py
      - tools/embeddinggemma2_swap/semantics_origin_a0/ttm_a0e_content_verified_preexec_guard_v3.py
      - tools/embeddinggemma2_swap/semantics_origin_a0/ttm_a0e_real_fourarm_t4_runner_v1.py
      - .github/workflows/ttm-gemma2-a0e-integrated-preexec-v3.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  a0e-source-negative-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Only test NEW source implementations, no old QA rerun
        run: |
          python -m pip install numpy==2.2.6
          for script in ttm_a0e_prospective_real_tensor_verifier_v1.py ttm_a0e_lexical_locked_scorer_v1.py ttm_a0e_content_verified_preexec_guard_v3.py ttm_a0e_real_fourarm_t4_runner_v1.py; do
            python -m py_compile "tools/embeddinggemma2_swap/semantics_origin_a0/$script"
          done
          python tools/embeddinggemma2_swap/semantics_origin_a0/ttm_a0e_prospective_real_tensor_verifier_v1.py --fixture
          python tools/embeddinggemma2_swap/semantics_origin_a0/ttm_a0e_lexical_locked_scorer_v1.py --fixture
          python tools/embeddinggemma2_swap/semantics_origin_a0/ttm_a0e_real_fourarm_t4_runner_v1.py --fixture
      - name: Real incomplete manifest MUST fail closed using content validation
        run: |
          python - <<'PY'
          import json,subprocess,sys
          cmd=[sys.executable,'tools/embeddinggemma2_swap/semantics_origin_a0/ttm_a0e_content_verified_preexec_guard_v3.py',
           '--manifest','artifacts/qa/ttm-embeddinggemma2/TTM_GEMMA2_A0E_TWO_PARTY_AMENDED_PREEXEC_MANIFEST_SOURCE_ONLY_20261111.json','--root','.']
          p=subprocess.run(cmd,check=False,text=True,capture_output=True)
          assert p.returncode==2,p.stdout+p.stderr
          j=json.loads(p.stdout.strip())
          assert j['status']=='NO_GO_HOLD' and j['T4_authorized'] is False
          assert any(k.startswith('REAL_CONTENT_') for k in j['missing'])
          print('A0E_INTEGRATED_NEW_CONTENT_QA=PASS_EXPECTED_NO_GO')
          print('GATES='+str(j['pass_count'])+'/'+str(j['total']))
          PY
      - name: Reject forged schema/status with a real SHA (negative)
        run: |
          python - <<'PY'
          import hashlib,importlib.util,json,tempfile
          from pathlib import Path
          fp=Path('tools/embeddinggemma2_swap/semantics_origin_a0/ttm_a0e_content_verified_preexec_guard_v3.py')
          spec=importlib.util.spec_from_file_location('gate',fp)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          manifest=json.loads(Path('artifacts/qa/ttm-embeddinggemma2/TTM_GEMMA2_A0E_TWO_PARTY_AMENDED_PREEXEC_MANIFEST_SOURCE_ONLY_20261111.json').read_text())
          with tempfile.TemporaryDirectory() as d:
            p=Path(d)/'fake.json';p.write_text('{"schema":"fake","status":"PASS"}')
            manifest['local_evidence']['full_A0E_training_runner_source']={'path':'fake.json','sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
            out=m.audit(manifest,d)
            assert out['checks']['REAL_CONTENT_full_A0E_training_runner_source']=='HOLD'
            print('A0E_FORGED_CONTENT_SHA_REJECTED=PASS')
          PY
