name: TTM Track A M0 source-only mock QA
on:
  pull_request:
    paths:
      - 'tools/pilot_t4/direct_failure_diag_q001/track_a_m0_v3/**'
      - '.github/workflows/ttm_track_a_m0_source_qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-source-qa-windows-py312:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert stdlib-only and Python 3.12
        shell: pwsh
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3,12)"
      - name: Mock gold-blind scorer QA
        shell: pwsh
        run: |
          python tools/pilot_t4/direct_failure_diag_q001/track_a_m0_v3/q001_m0_goldblind.py mock-qa
      - name: Adversarial unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tools/pilot_t4/direct_failure_diag_q001/track_a_m0_v3 -p 'test_*.py' -v
      - name: Separately implemented negative checker (not human independence)
        shell: pwsh
        run: |
          python tools/pilot_t4/direct_failure_diag_q001/track_a_m0_v3/independent_m0_review.py

      - name: Windows PowerShell 5.1 Python 3.12 compatibility
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'NOT_POWERSHELL_5_1' }
          python -c "import sys; assert sys.version_info[:2] == (3,12)"
          python tools/pilot_t4/direct_failure_diag_q001/track_a_m0_v3/q001_m0_goldblind.py mock-qa
      - name: Emit mock manifest JSON and exact source SHA-256 for immutable evidence
        shell: pwsh
        run: |
          python -c "import sys,json;sys.path.insert(0,'tools/pilot_t4/direct_failure_diag_q001/track_a_m0_v3');from q001_m0_goldblind import make_fixture,manifest;print('M0_MANIFEST_JSON='+json.dumps(manifest(make_fixture(list(range(300,500)))),sort_keys=True))"
          python -c "import hashlib,json,pathlib;d=pathlib.Path('tools/pilot_t4/direct_failure_diag_q001/track_a_m0_v3');names=['q001_m0_goldblind.py','test_q001_m0_goldblind.py','independent_m0_review.py'];print('M0_SOURCE_HASHES_JSON='+json.dumps({n:hashlib.sha256((d/n).read_bytes()).hexdigest() for n in names},sort_keys=True))"
