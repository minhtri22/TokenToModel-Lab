name: TTM VM R8 G2 owner-Windows preexec PS5.1 static QA

on:
  push:
    branches:
      - implementation/ttm-vm-r8-g2-owner-windows-preexec-20261115
    paths:
      - docs/research/vector-memory/r8/preexec/Invoke-TTM-VM-R8-G2-OwnerWindows-Integrated-Preexec-PS51.ps1
      - .github/workflows/ttm-vm-r8-g2-owner-windows-preexec-staticqa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps51-static-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse exact preexec script under Windows PowerShell 5.1 without running it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Path = 'docs/research/vector-memory/r8/preexec/Invoke-TTM-VM-R8-G2-OwnerWindows-Integrated-Preexec-PS51.ps1'
          $Tokens = $null; $Errors = $null
          $Ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $Path).Path, [ref]$Tokens, [ref]$Errors)
          if (-not $Ast -or $Errors.Count -ne 0) {
            foreach($e in $Errors) { Write-Host ('PARSE_ERROR: ' + $e.Message) }
            throw 'PS51_PREEXEC_PARSE_FAIL'
          }
          $Raw = [IO.File]::ReadAllText((Resolve-Path $Path).Path)
          foreach($required in @('GPRE_AUTHENTIC_HMAC', 'G3_EXECUTED', 'GITHUB_REAL_SENTINEL_ATTESTATION', 'ONE_SHOT_RECEIPT_ALREADY_EXISTS')) {
            if(-not $Raw.Contains($required)) {throw ('STATIC_CONTRACT_MISSING: '+$required)}
          }
          if($Raw -match '(?im)^\s*&\s*\$GitHubCliExe\s+release\s+(create|delete|upload|edit)\b') {
            throw 'FORBIDDEN_GITHUB_MUTATION'
          }
          if($Raw -match '(?im)^\s*&\s*\$PythonExe\s+.*(train|generate|dispatch)') {
            throw 'FORBIDDEN_SCIENCE_EXECUTION'
          }
          Write-Host 'PS51_PREEXEC_PARSE=PASS'
          Write-Host 'PS51_SAFE_STATIC_CONTRACT=PASS'
          Write-Host 'PREEXEC_EXECUTION=NOT_EXECUTED_ON_HOSTED_RUNNER'

  hosted-public-sentinel-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run public GitHub signature verification and ephemeral DPAPI sentinel only
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root=$env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path (Join-Path $root '_private\r8_custody\receipts') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root '_tmp') | Out-Null
          $script=Join-Path $root 'docs\research\vector-memory\r8\preexec\Invoke-TTM-VM-R8-G2-OwnerWindows-Integrated-Preexec-PS51.ps1'
          & $script -ProjectRoot $root
          if($LASTEXITCODE -and $LASTEXITCODE -ne 0){throw 'PREEXEC_SCRIPT_EXECUTION_ERROR'}
          $receipt=Join-Path $root '_private\r8_custody\receipts\g2-owner-windows-protected-trust-boundary-preexec-20261115.json'
          $record=Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if($record.states.WINDOWS_DPAPI_CURRENTUSER_SENTINEL -ne 'PASS_SCOPED_SAME_PROFILE_ONLY') {
            throw 'HOSTED_DPAPI_SENTINEL_FAILED'
          }
          if($record.states.GITHUB_REAL_SENTINEL_ATTESTATION -ne 'PASS_SCOPED_GITHUB_SIGNED_PUBLIC_SENTINEL') {
            throw 'HOSTED_GITHUB_SIGNED_SENTINEL_FAILED'
          }
          if($record.states.GPRE_AUTHENTIC_HMAC -ne 'NOT_EXECUTED' -or $record.states.G3_EXECUTED -ne $false) {
            throw 'SCIENCE_BOUNDARY_VIOLATION'
          }
          Write-Host 'HOSTED_DPAPI_SENTINEL=PASS_SCOPED'
          Write-Host 'HOSTED_GITHUB_SIGNED_SENTINEL=PASS_SCOPED'
          Write-Host 'OWNER_WINDOWS_CUSTODY=NOT_EXECUTED'
